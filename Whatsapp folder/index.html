<!DOCTYPE html>
<html>
<head>
  <title>Whatsapp chat layout</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <div class="left-section"> ←  <img src="img9.png" alt="Palak">   Palak Tiwari

  <div class="chat right">Hi! How are you?</div>
  <div class="chat left">I am fine what about you</div>

  </div>
  <form>

    </div>
  </form>
</div>
</body>
</html>
